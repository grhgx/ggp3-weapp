// ═══════ 音效引擎 ═══════
const SFX={_c:null,_ok:false,
  init(){if(this._ok)return;try{this._c=new(window.AudioContext||window.webkitAudioContext)();this._ok=true;}catch(e){this._ok=false;}},
  play(id,dur=.15,vol=.08){
    if(!this._ok)this.init();if(!this._ok||!this._c)return;
    try{
    const ac=this._c,t=ac.currentTime,g=ac.createGain(),o=ac.createOscillator();g.connect(ac.destination);o.connect(g);
    const rf=(f1,f2)=>{o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+dur);};
    g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+dur);
    switch(id){
      case'atk':o.type='square';rf(220,60);g.gain.setValueAtTime(.12,t);break;
      case'crt':o.type='sawtooth';rf(500,80);g.gain.setValueAtTime(.15,t);dur=.28;break;
      case'fire':o.type='sawtooth';rf(350,55);g.gain.setValueAtTime(.18,t);dur=.4;break;
      case'heal':o.type='sine';[400,600,500,800].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.07));g.gain.setValueAtTime(.07,t);dur=.4;break;
      case'lvl':o.type='square';[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.1));g.gain.setValueAtTime(.08,t);dur=.55;break;
      case'hurt':o.type='sawtooth';rf(130,40);g.gain.setValueAtTime(.12,t);break;
      case'buy':o.type='triangle';rf(700,1100);g.gain.setValueAtTime(.09,t);break;
      case'click':o.type='triangle';o.frequency.setValueAtTime(500,t);g.gain.setValueAtTime(.04,t);dur=.04;break;
      case'pet':o.type='sine';[523,659,784,880,1047,880,784,659].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.11));g.gain.setValueAtTime(.03,t);dur=1.0;break;
      case'err':o.type='square';rf(180,120);g.gain.setValueAtTime(.09,t);break;
      case'boss':o.type='sawtooth';rf(100,35);g.gain.setValueAtTime(.2,t);dur=.45;break;
      case'dash':o.type='triangle';rf(300,900);g.gain.setValueAtTime(.07,t);dur=.12;break;
      case'drop':o.type='sine';rf(700,300);g.gain.setValueAtTime(.08,t);dur=.22;break;
      case'coin':o.type='triangle';rf(900,1400);g.gain.setValueAtTime(.06,t);dur=.08;break;
      case'hit1':o.type='square';rf(300,60);g.gain.setValueAtTime(.14,t);dur=.18;break;
      case'hit2':o.type='triangle';rf(500,100);g.gain.setValueAtTime(.12,t);dur=.2;break;
      case'chst':o.type='sine';[600,800,1000,1200].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.08));g.gain.setValueAtTime(.06,t);dur=.4;break;
      case'ring':o.type='sine';rf(800,200);g.gain.setValueAtTime(.1,t);dur=.3;break;
      default:o.type='sine';o.frequency.setValueAtTime(440,t);g.gain.setValueAtTime(.05,t);
    }o.start(t);o.stop(t+dur+.05);
    }catch(e){}
  }
};

// ═══════ 玩家数据 ═══════
function mkPlayer(){return{name:'猪猪勇者',lv:1,xp:0,hp:130,mhp:130,mp:55,mmp:55,atk:24,def:13,matk:10,mdef:8,spd:2.2,gold:0,coins:0,bagSize:100,inv:[],eq:{head:null,weapon:null,armor:null,acc:null,ring:null,boots:null},skillsKnown:['charge','heal','meteor'],skillSlots:['charge','heal','meteor',null],wings:false,title:'',x:0,y:0,face:'down',mv:false,bob:0,lastSv:Date.now()};}
const EQP=['head','weapon','armor','acc','ring','boots'];
const ELB={head:'头冠',weapon:'武器',armor:'战甲',acc:'饰品',ring:'戒指',boots:'战靴'};
const EIC={head:'👑',weapon:'⚔️',armor:'🛡️',acc:'💍',ring:'💠',boots:'👢'};
function eAtk(){let a=player.atk;for(const s of EQP)if(player.eq[s]&&player.eq[s].atk)a+=player.eq[s].atk;return a;}
function eDef(){let d=player.def;for(const s of EQP)if(player.eq[s]&&player.eq[s].def)d+=player.eq[s].def;return d;}
function eMatk(){let m=player.matk;for(const s of EQP)if(player.eq[s]&&player.eq[s].matk)m+=player.eq[s].matk;return m;}
function eMdef(){let m=player.mdef;for(const s of EQP)if(player.eq[s]&&player.eq[s].mdef)m+=player.eq[s].mdef;return m;}
function eCrt(){let c=.05;for(const s of EQP)if(player.eq[s]&&player.eq[s].crt)c+=player.eq[s].crt;return c;}
function eLfS(){let l=0;for(const s of EQP)if(player.eq[s]&&player.eq[s].lifesteal)l+=player.eq[s].lifesteal;return l;}
function eSpd(){let s=player.spd;for(const k of EQP)if(player.eq[k]&&player.eq[k].spd)s+=player.eq[k].spd;return s;}
function eHpB(){let b=0;for(const k of EQP)if(player.eq[k]&&player.eq[k].hpBonus)b+=player.eq[k].hpBonus;return b;}
function eMhp(){return player.mhp+eHpB();}
function clampHp(){if(player.hp>eMhp())player.hp=eMhp();}
function sumEq(eq){if(!eq)return 0;let s=0;if(eq.atk)s+=eq.atk*2;if(eq.def)s+=eq.def*1.5;if(eq.matk)s+=eq.matk*2;if(eq.mdef)s+=eq.mdef*1.5;if(eq.lifesteal)s+=eq.lifesteal*8;if(eq.crt)s+=eq.crt*60;if(eq.hpBonus)s+=eq.hpBonus*.3;if(eq.spd)s+=eq.spd*5;return s;}
function xpN(lv){return lv*65+lv*lv*14;}

// ═══════ 物品系统 ═══════
const ITY={CON:'consumable',EQ:'equipment',COL:'collectible',MAT:'material',BAG:'bag',SKB:'skillbook'};
const Q={HP:'potion_hp',MP:'potion_mp',C:'common',R:'rare',E:'epic',L:'legend',M:'mythic'};
const QC={common:'#b0b0b0',rare:'#55aaff',epic:'#cc55ff',legend:'#ff8833',mythic:'#ff3333',potion_hp:'#ff7777',potion_mp:'#7799ff'};
const EQPREF=['锐利','坚固','神秘','远古','暗影','圣光','烈焰','寒冰','风暴','大地','灵魂','龙牙','凤凰','雷鸣','月影'];
const EQSUFF=['之怒','的庇护','的低语','的祝福','的诅咒','之牙','之星','之歌','之翼','的眼泪'];
const EQNAME={weapon:['短剑','长剑','战斧','巨锤','匕首','弯刀','长弓','法杖','战矛','镰刀','利爪'],armor:['皮甲','锁子甲','板甲','魔导师袍','龙鳞甲','暗影斗篷','圣骑士铠','轻羽衣'],head:['布帽','铁盔','秘银冠','龙角盔','暗影兜帽','圣光头环','凤羽冠'],acc:['护符','徽章','圣徽','魔石','龙心坠','灵珠','羽饰'],ring:['铜环','银戒','金箍','魔戒','龙瞳戒','圣约之环','元素指环'],boots:['皮靴','铁靴','风行靴','暗影靴','圣光步履','龙翼靴','闪现之履']};
function mkItem(type,qual,slot){
  const it={uid:UID(),type,quality:qual,name:'',ico:'',val:0,stack:1};
  if(type===ITY.CON){
    if(qual===Q.HP){it.name='生命药水';it.ico='🧪';it.heal=55;it.val=25;it.desc='恢复55HP';}
    else if(qual===Q.MP){it.name='魔法药水';it.ico='💧';it.restore=35;it.val=30;it.desc='恢复35MP';}
    else if(qual==='big_hp'){it.name='大生命药水';it.ico='🧪';it.heal=130;it.val=80;it.desc='恢复130HP';}
    else if(qual==='big_mp'){it.name='大魔法药水';it.ico='💧';it.restore=80;it.val=90;it.desc='恢复80MP';}
  }else if(type===ITY.BAG){
    it.name='扩容背包';it.ico='🎒';it.val=500;it.desc='背包上限+10(最多300格)';
  }else if(type===ITY.EQ){
    it.slot=slot||PK(EQP);
    const bn=PK(EQNAME[it.slot]),pref=PK(EQPREF),suff=Math.random()<.4?PK(EQSUFF):'';
    it.ico=EIC[it.slot];
    const lv=player?player.lv:1,mu=.6+lv*.25;
    if(qual===Q.C){
      it.name=bn+'(凡)';it.atk=RI(4,9);it.def=RI(2,6);it.val=35+RI(0,30);
      if(Math.random()<.3){if(Math.random()<.5)it.matk=RI(2,5);else it.mdef=RI(2,4);}
    }else if(qual===Q.R){
      it.name=pref+bn+'(稀)';it.atk=RI(9,18);it.def=RI(6,13);it.val=100+RI(0,80);
      const r=Math.random();
      if(r<.3)it.matk=RI(6,14);else if(r<.5)it.mdef=RI(5,10);else if(r<.65)it.crt=.06+Math.random()*.05;else if(r<.8)it.lifesteal=.04+Math.random()*.06;else it.hpBonus=RI(20,50);
    }else if(qual===Q.E){
      it.name=pref+bn+suff+'(史)';it.atk=RI(16,28);it.def=RI(12,22);it.val=300+RI(0,200);
      const r=Math.random();
      if(r<.25){it.matk=RI(12,22);it.mdef=RI(8,16);}else if(r<.5){it.crt=.08+Math.random()*.08;it.atk+=RI(3,8);}else if(r<.7){it.lifesteal=.07+Math.random()*.1;it.def+=RI(2,6);}else if(r<.85){it.hpBonus=RI(40,90);it.def+=RI(3,8);}else{it.spd=RI(0,1);it.atk+=RI(2,6);}
    }else if(qual===Q.L){
      it.name=pref+bn+suff+'(传)';it.atk=RI(24,40);it.def=RI(18,32);
      const r=Math.random();
      if(r<.2){it.matk=RI(18,32);it.mdef=RI(12,24);it.crt=.06+Math.random()*.06;}else if(r<.45){it.lifesteal=.1+Math.random()*.12;it.atk+=RI(5,12);it.crt=.04+Math.random()*.04;}else if(r<.7){it.crt=.1+Math.random()*.1;it.hpBonus=RI(60,130);it.atk+=RI(4,10);}else{it.hpBonus=RI(50,110);it.spd=RI(1,2);it.def+=RI(5,12);}
      it.val=700+RI(0,500);
    }else if(qual===Q.M){
      it.name=pref+bn+suff+'(神话)';it.atk=RI(38,58);it.def=RI(28,46);it.matk=RI(22,38);it.mdef=RI(18,30);
      it.crt=.08+Math.random()*.1;it.lifesteal=.08+Math.random()*.12;it.hpBonus=RI(80,180);it.spd=RI(1,3);
      it.val=1500+RI(0,1000);
    }
    it.rc=QC[qual];
  }else if(type===ITY.MAT){
    const ms=['魔晶碎片','龙鳞','月光石','凤凰羽','暗影精华','星辰粉末','世界树之叶','熔岩核心','时光沙','虚空结晶'];
    it.name=PK(ms);it.ico='💎';it.val=15+RI(0,50);it.desc='合成材料';
  }else if(type===ITY.SKB){
    const pool=Object.keys(SKDB).filter(sid=>!player.skillsKnown.includes(sid));
    const sid=pool.length>0?PK(pool):null;
    if(sid){const sk=SKDB[sid];it.name='技能书·'+sk.n;it.ico='📖';it.val=200;it.desc='学会'+sk.n;it.skillId=sid;}else{it.name='技能书(已全学)';it.ico='📖';it.val=50;it.desc='出售换金币吧';it.skillId=null;}
  }else if(type===ITY.COL){it.name='猪猪币';it.ico='🪙';it.val=100;it.quality='coin';it.stack=1;}
  return it;
}
function mkBB(){const r=Math.random();return mkItem(ITY.EQ,r<.00002?Q.M:(r<.00022?Q.L:(r<.0022?Q.E:(r<.022?Q.R:Q.C))));}
function autoEquip(it){
  if(it.type!==ITY.EQ)return false;const sl=it.slot,cur=player.eq[sl];
  if(!cur){player.eq[sl]=it;clampHp();return true;}
  if(sumEq(it)>sumEq(cur)){player.inv.push(cur);player.eq[sl]=it;clampHp();return true;}
  return false;
}
function tryStack(it){
  const ex=player.inv.find(e=>e.type===it.type&&e.name===it.name&&e.quality===it.quality&&(e.stack||1)<99);
  if(ex){ex.stack=(ex.stack||1)+1;return true;}
  return false;
}

// ═══════ 工具函数 ═══════
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();}
function dbar(x,y,w,h,cur,max,fg,bg){X.fillStyle=bg||'#222';rr(x,y,w,h,3);X.fill();if(cur>0){const p=Math.max(0,cur/max);X.fillStyle=fg;rr(x,y,w*p,h,3);X.fill();}}
function glowT(t,x,y,c,s){X.shadowColor=c;X.shadowBlur=14;X.fillStyle='#fff';X.font=`bold ${s}px "Microsoft YaHei"`;X.textAlign='center';X.fillText(t,x,y);X.shadowBlur=0;X.textAlign='start';}
function dstar(x,y,r1,r2,pts){X.beginPath();for(let i=0;i<pts*2;i++){const r=i%2===0?r1:r2,a=i*PI/pts-PI/2;if(i===0)X.moveTo(x+r*Math.cos(a),y+r*Math.sin(a));else X.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}X.closePath();X.fill();}
function hashS(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}
/** Canvas绘制肖像 - 程序化生成独特面孔 */
function drawPortrait(cx,cy,r,seed,isMon){
  X.save();
  try{
  X.translate(cx,cy);
  const h=hashS(seed);
  // 肤色
  const scs=isMon?['#ffccaa','#ddeeff','#ccffcc','#ffddcc','#eeccff','#ccddff']:['#ffe4c4','#f5d5b8','#e8c8a0','#ffdcc8','#fce0c8','#eed8c0'];
  const sk=scs[h%scs.length];
  // 脸型
  const ew=(h%3)*.08+.92,eh=((h>>2)%3)*.1+.9;
  const fG=X.createRadialGradient(-1,-2,r*.15,0,0,r);
  fG.addColorStop(0,sk);fG.addColorStop(.85,sk);fG.addColorStop(1,isMon?'#00000030':'#00000020');
  X.fillStyle=fG;X.beginPath();X.ellipse(0,isMon?-1:1,r*ew,r*eh,0,0,T);X.fill();
  X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=r*.06;X.stroke();
  if(!isMon){
    // 腮红
    X.fillStyle='rgba(255,150,150,.25)';X.beginPath();X.ellipse(-r*.48,r*.2,r*.18,r*.1,0,0,T);X.fill();
    X.beginPath();X.ellipse(r*.48,r*.2,r*.18,r*.1,0,0,T);X.fill();
  }
  // 眼睛
  const es=(h>>4)%3,ew2=r*(.25+es*.06),eh2=r*(.28+es*.05),esp=r*(.28+(h>>6)%2*.08);
  for(const s of[-1,1]){
    const ex=s*esp,ey=-r*.12-(h>>8)%2*r*.08;
    // 眼白
    X.fillStyle='#fff';X.beginPath();X.ellipse(ex,ey,ew2,eh2,0,0,T);X.fill();
    X.strokeStyle='rgba(0,0,0,.5)';X.lineWidth=r*.03;X.stroke();
    // 瞳孔
    const pc=isMon?['#ff4444','#4444ff','#44aa44','#ff8800','#aa22aa'][(h>>10)%5]:['#3a2010','#4a3020','#2a1808','#1a0a00'][(h>>10)%4];
    X.fillStyle=pc;X.beginPath();X.arc(ex,ey,ew2*.5,0,T);X.fill();
    // 高光
    X.fillStyle='#fff';X.beginPath();X.arc(ex-ew2*.2,ey-eh2*.3,ew2*.22,0,T);X.fill();
  }
  // 眉毛
  X.strokeStyle='rgba(0,0,0,.45)';X.lineWidth=r*.05;X.lineCap='round';
  const ba=(h>>12)%3-1;
  for(const s of[-1,1]){
    X.beginPath();
    const bx=s*esp,by=ey-eh2-r*.06;
    X.moveTo(bx-s*ew2*.9,by+ba*.5);X.quadraticCurveTo(bx,by-ba*.5,bx+s*ew2*.9,by+ba*.5);X.stroke();
  }
  // 鼻子
  const nt=(h>>14)%2;
  if(nt===0){X.fillStyle='rgba(0,0,0,.15)';X.beginPath();X.arc(0,r*.08,r*.05,PI,0);X.fill();}
  else{X.fillStyle='rgba(0,0,0,.12)';X.beginPath();X.moveTo(-r*.04,r*.02);X.lineTo(0,-r*.03);X.lineTo(r*.04,r*.02);X.fill();}
  // 嘴巴
  const mt=(h>>15)%3,my=r*.25;
  X.strokeStyle='rgba(0,0,0,.4)';X.lineWidth=r*.04;X.lineCap='round';
  if(mt===0){X.beginPath();X.arc(0,my,r*.12,.1,PI-.1);X.stroke();}
  else if(mt===1){X.beginPath();X.arc(0,my-r*.04,r*.1,PI+.3,T-.3);X.stroke();}
  else{X.beginPath();X.moveTo(-r*.1,my-.05);X.lineTo(r*.1,my+.05);X.stroke();}
  // 头发/帽子(仅NPC)
  if(!isMon){
    const hc=['#3a2010','#6a3a20','#1a1a1a','#aa5530','#dda060','#442010','#887766'][(h>>17)%7];
    X.fillStyle=hc;X.beginPath();X.arc(0,-r*.12,r*1.05,PI,0);X.fill();
    const bs=(h>>20)%2;
    if(bs===0){X.fillStyle=hc;X.beginPath();X.ellipse(0,-r*.35,r*.6,r*.25,0,0,T);X.fill();}
    else{X.fillStyle=hc;X.beginPath();X.arc(-r*.3,-r*.5,r*.25,0,T);X.fill();X.beginPath();X.arc(r*.3,-r*.5,r*.25,0,T);X.fill();}
    // 配饰
    const accT=(h>>24)%5;
    if(accT===1){// 眼镜
      X.strokeStyle='#333';X.lineWidth=r*.05;X.beginPath();X.arc(-r*.28,r*.02,r*.15,0,T);X.stroke();X.beginPath();X.arc(r*.28,r*.02,r*.15,0,T);X.stroke();X.beginPath();X.moveTo(-r*.13,r*.02);X.lineTo(r*.13,r*.02);X.stroke();}
    else if(accT===2){// 花
      for(let i=0;i<5;i++){const a=i*T/5;X.fillStyle=i%2===0?'#ff88aa':'#ffaacc';X.beginPath();X.arc(r*.4+Math.cos(a)*r*.1,-r*.3+Math.sin(a)*r*.1,r*.06,0,T);X.fill();}X.fillStyle='#ffee44';X.beginPath();X.arc(r*.4,-r*.3,r*.04,0,T);X.fill();}
    else if(accT===3){// 眼罩
      X.fillStyle='#222';X.beginPath();X.arc(-r*.28,r*.02,r*.16,0,T);X.fill();X.strokeStyle='#111';X.lineWidth=r*.03;X.beginPath();X.moveTo(-r*.44,r*.02);X.lineTo(r*.3,-r*.12);X.stroke();}
    else if(accT===4){// 耳环
      X.strokeStyle='#ffd700';X.lineWidth=r*.04;X.beginPath();X.arc(r*.55,r*.05,r*.09,PI*.7,PI*1.3);X.stroke();X.fillStyle='#ffd700';X.beginPath();X.arc(r*.55,r*.14,r*.03,0,T);X.fill();}
    // 伤疤
    const scT=(h>>26)%3;
    if(scT===1){X.strokeStyle='rgba(200,150,150,.5)';X.lineWidth=r*.03;X.beginPath();X.moveTo(-r*.5,r*.1);X.lineTo(-r*.15,r*.3);X.stroke();}
    else if(scT===2){X.strokeStyle='rgba(200,150,150,.5)';X.lineWidth=r*.03;X.beginPath();X.moveTo(r*.5,r*.1);X.lineTo(r*.15,r*.3);X.stroke();}
    // 精灵耳
    if((h>>28)%4===3){X.fillStyle=sk;X.beginPath();X.moveTo(r*.5,-r*.15);X.lineTo(r*.75,-r*.35);X.lineTo(r*.55,-r*.05);X.fill();X.beginPath();X.moveTo(-r*.5,-r*.15);X.lineTo(-r*.75,-r*.35);X.lineTo(-r*.55,-r*.05);X.fill();}
    // 王冠(特定种子)
    const crT=(h>>30)%2;
    if(seed.includes('王')||seed.includes('王座')||crT===0&&(seed.includes('玄')||seed.includes('贤'))){
      X.fillStyle='#ffd700';X.font=`${r*.45}px "Microsoft YaHei"`;X.textAlign='center';X.fillText('👑',0,-r*.9);X.textAlign='start';}
  }
  // 怪物特有装饰
  if(isMon){
    if(seed.startsWith('boss')||seed.startsWith('abyss_boss')){X.fillStyle='#ffd700';X.font=`${r*.5}px "Microsoft YaHei"`;X.textAlign='center';X.fillText('👑',0,-r*1.15);X.textAlign='start';}
    if(seed.startsWith('slime')||seed.startsWith('sludge')){X.fillStyle='rgba(255,255,255,.25)';X.beginPath();X.ellipse(-r*.3,-r*.35,r*.2,r*.06,-.2,0,T);X.fill();}
    if(seed.startsWith('fire')||seed.startsWith('frost_spirit')){for(let i=0;i<4;i++){X.fillStyle=`rgba(255,${100+i*30},20,.4)`;X.beginPath();X.arc(0,-r*.6,(r*.2-i*.03),0,T);X.fill();}}
    if(seed.startsWith('yeti')||seed.startsWith('ice_golem')){X.fillStyle='rgba(200,230,255,.4)';X.font=`${r*.35}px "Microsoft YaHei"`;X.textAlign='center';X.fillText('❄',r*.3,-r*.5);X.textAlign='start';}
    if(seed.startsWith('shadow')||seed.startsWith('void')){X.fillStyle='rgba(200,100,255,.5)';X.beginPath();X.ellipse(-r*.25,-r*.4,r*.12,r*.04,-.3,0,T);X.fill();X.beginPath();X.ellipse(r*.25,-r*.4,r*.12,r*.04,.3,0,T);X.fill();}
    if(seed.startsWith('mummy')){X.strokeStyle='rgba(200,180,150,.3)';X.lineWidth=r*.04;for(let i=0;i<3;i++){X.beginPath();X.moveTo(-r*.5,-r*.2+i*r*.25);X.lineTo(r*.5,-r*.1+i*r*.25);X.stroke();}}
  }
  }catch(e){}finally{X.restore();}
}

/** 绘制乖乖猪 - 多层渲染，高质量 */
function drawPig(px,py,s,bounce,wings,face){
  const cx=px+s/2,cy=py+s/2+bounce;
  X.save();
  try{
  X.translate(cx,cy);
  // 地面阴影
  X.fillStyle='rgba(0,0,0,0.3)';X.beginPath();X.ellipse(0,s/2+3,s/2-3,5,0,0,T);X.fill();
  // 身体外层光晕
  X.fillStyle='rgba(255,180,200,0.2)';X.beginPath();X.arc(0,0,s/2+5,0,T);X.fill();
  // 身体 - 径向渐变

  bGrd.addColorStop(0,'#fff0f5');bGrd.addColorStop(0.3,'#ffe0ec');bGrd.addColorStop(0.7,'#ffb8cc');bGrd.addColorStop(1,'#f090a8');
  X.fillStyle=bGrd;X.beginPath();X.arc(0,0,s/2-1,0,T);X.fill();
  X.strokeStyle='#e08098';X.lineWidth=1.8;X.stroke();
  // 高光
  X.fillStyle='rgba(255,255,255,0.3)';X.beginPath();X.ellipse(-3,-6,s/5,s/8,-.3,0,T);X.fill();

  // 耳朵 (带内阴影)
  for(const side of[-1,1]){
    const ex=side*7,ey=-12;
    X.fillStyle='#ffa8c0';X.beginPath();X.ellipse(ex,ey,5.5,9,side*-.3,0,T);X.fill();X.strokeStyle='#e08098';X.lineWidth=1.2;X.stroke();
    X.fillStyle='#ffd0dd';X.beginPath();X.ellipse(ex,ey+1,3.5,6,side*-.3,0,T);X.fill();
    // 耳尖高光
    X.fillStyle='rgba(255,255,255,0.4)';X.beginPath();X.arc(ex,ey-6,2,0,T);X.fill();
  }
  // 脸部
  const fGrd=X.createRadialGradient(0,2,0,0,2,s/2-5);
  fGrd.addColorStop(0,'#ffe8f0');fGrd.addColorStop(1,'#ffd0e0');
  X.fillStyle=fGrd;X.beginPath();X.ellipse(0,2,s/2-5,s/2-7,0,0,T);X.fill();

  // 眼睛 - 卡通大眼
  for(const side of[-1,1]){
    const ex=side*6.5,ey=-2;
    // 眼眶
    X.fillStyle='#1a1a2e';X.beginPath();X.arc(ex,ey,4.2,0,T);X.fill();
    // 瞳孔
    X.fillStyle='#fff';X.beginPath();X.arc(ex+1,ey-1.5,2.2,0,T);X.fill();
    // 高光
    X.fillStyle='#fff';X.beginPath();X.arc(ex-.5,ey-2.5,1,0,T);X.fill();
    X.fillStyle='#222';X.beginPath();X.arc(ex+.5,ey-1,1.1,0,T);X.fill();
  }

  // 鼻子
  const nGrd=X.createRadialGradient(0,4,0,0,4,6);
  nGrd.addColorStop(0,'#ff99aa');nGrd.addColorStop(1,'#ee6677');
  X.fillStyle=nGrd;X.beginPath();X.ellipse(0,4,6,4.5,0,0,T);X.fill();
  X.fillStyle='#cc4466';X.beginPath();X.arc(-2,4,1,0,T);X.fill();X.beginPath();X.arc(2,4,1,0,T);X.fill();
  // 鼻子高光
  X.fillStyle='rgba(255,255,255,0.4)';X.beginPath();X.ellipse(0,2.5,2.5,1.2,0,0,T);X.fill();

  // 腮红
  X.fillStyle='rgba(255,140,160,0.4)';X.beginPath();X.ellipse(-9.5,3,5,3.5,0,0,T);X.fill();X.beginPath();X.ellipse(9.5,3,5,3.5,0,0,T);X.fill();

  // 微笑
  X.strokeStyle='#cc6688';X.lineWidth=1.2;X.lineCap='round';X.beginPath();X.arc(0,7,3,.2,PI-.2);X.stroke();

  // 翅膀(高品质)
  if(wings){
    for(const side of[-1,1]){
      const wx=side*16,wy=-6;
      X.fillStyle='rgba(255,255,255,0.75)';
      X.beginPath();X.moveTo(wx-side*4,wy);X.quadraticCurveTo(wx-side*14,wy-14,wx-side*10,wy-26);X.quadraticCurveTo(wx-side*4,wy-16,wx,wy);X.fill();
      X.strokeStyle='rgba(180,200,255,0.6)';X.lineWidth=1;X.stroke();

  X.fillStyle='#ffc8d8';X.beginPath();X.arc(8,-5,2.5,0,T);X.fill();

  }catch(e){}finally{X.restore();}
}

/** 绘制怪物 - 每种独特形状 */
function drawMonster(mx,my,mon){
  const s=mon.sz,cx=mx+s/2,cy=my+s/2+Math.sin(frm*.07+mon.bo)*3;
  X.save();

    X.fillStyle=`rgba(255,80,30,${al})`;X.beginPath();X.arc(0,0,s/2+16,0,T);X.fill();

  X.fillStyle=g;

  switch(mon.sh){
    case'blob':// 软泥怪 - 水滴形
      X.beginPath();X.moveTo(0,-s/2);X.quadraticCurveTo(s/2+3,-s/4,s/2+2,s/4);X.quadraticCurveTo(s/2+1,s/2+2,0,s/2+3);X.quadraticCurveTo(-s/2-1,s/2+2,-s/2-2,s/4);X.quadraticCurveTo(-s/2-3,-s/4,0,-s/2);X.fill();
      X.strokeStyle='rgba(0,0,0,0.3)';X.lineWidth=1.5;X.stroke();
      X.fillStyle='rgba(255,255,255,0.2)';X.beginPath();X.ellipse(-3,-3,s/5,s/8,-.2,0,T);X.fill();
      break;
    case'rabbit':// 兔子 - 圆身体+长耳朵
      X.beginPath();X.arc(0,0,s/2,0,T);X.fill();X.strokeStyle='rgba(0,0,0,0.3)';X.lineWidth=1.5;X.stroke();
      for(const si of[-1,1]){X.fillStyle=mon.c;X.beginPath();X.ellipse(si*5,-s/2-2,4,10,si*.2,0,T);X.fill();X.stroke();X.fillStyle='rgba(255,200,200,0.5)';X.beginPath();X.ellipse(si*5,-s/2-1,2.5,7,si*.2,0,T);X.fill();}
      break;
    case'boar':// 野猪 - 粗壮
      X.beginPath();X.arc(0,0,s/2,0,T);X.fill();X.strokeStyle='rgba(0,0,0,0.4)';X.lineWidth=2;X.stroke();
      X.fillStyle='#8a5a3a';X.beginPath();X.arc(0,-2,s/3,PI,0);X.fill();// 鬃毛
      break;
    case'treant':// 树精 - 三角
      X.beginPath();X.moveTo(0,-s/2-4);X.lineTo(s/2+2,s/3);X.lineTo(-s/2-2,s/3);X.closePath();X.fill();X.strokeStyle='rgba(0,0,0,0.3)';X.lineWidth=1.5;X.stroke();
      X.fillStyle='#4a6a2a';X.fillRect(-3,s/3-2,6,10);break;
    case'bat':// 蝙蝠 - 倒挂
      X.beginPath();X.arc(0,3,s/2-2,0,T);X.fill();X.stroke();
      for(const si of[-1,1]){X.fillStyle=mon.c;X.beginPath();X.moveTo(si*4,0);X.quadraticCurveTo(si*(s/2+8),-s/3,si*(s/2+4),-s/2+2);X.quadraticCurveTo(si*8,-s/4,si*4,0);X.fill();X.stroke();}break;
    case'spider':// 蜘蛛 - 多腿
      X.beginPath();X.ellipse(0,0,s/3,s/2.5,0,0,T);X.fill();X.stroke();
      for(let i=0;i<8;i++){const a=i*PI/4;X.strokeStyle='rgba(0,0,0,0.4)';X.lineWidth=1.5;X.beginPath();X.moveTo(Math.cos(a)*s/4,Math.sin(a)*s/4);X.lineTo(Math.cos(a)*s/2,Math.sin(a)*s/2);X.stroke();}break;
    case'fire':// 火元素 - 泪滴
      X.beginPath();X.moveTo(0,-s/2-4);X.quadraticCurveTo(s/2+2,0,s/2,-s/3);X.quadraticCurveTo(s/2+4,s/2,0,s/2+2);X.quadraticCurveTo(-s/2-4,s/2,-s/2,-s/3);X.quadraticCurveTo(-s/2-2,0,0,-s/2-4);X.fill();X.stroke();
      break;
    case'golem':// 魔像 - 方形
      rr(-s/2,-s/2,s,s,6);X.fill();X.strokeStyle='rgba(0,0,0,0.5)';X.lineWidth=2;X.stroke();
      X.fillStyle='rgba(0,0,0,0.2)';X.fillRect(-s/4,-s/2+2,s/2,4);break;
    case'worm':// 蠕虫 - 分段
      for(let i=0;i<4;i++){X.fillStyle=`${mon.c}${(1-i*.15).toString(16).padStart(2,'f')}`;X.beginPath();X.arc(0,-s/3+i*s/5,s/3.5,0,T);X.fill();X.stroke();}break;
    case'knight':// 骑士 - 人形
      X.beginPath();X.arc(0,-s/5,s/3,0,T);X.fill();X.fillRect(-s/4,-2,s/2,s/3);X.fill();X.stroke();
      X.fillStyle='#333';rr(-s/3,-s/5-s/4,s*.66,s/4,3);X.fill();break;
    case'mage':// 法师 - 长袍三角
      X.beginPath();X.arc(0,-s/5,s/3.5,0,T);X.fill();
      X.beginPath();X.moveTo(-s/4,-2);X.lineTo(0,s/2);X.lineTo(s/4,-2);X.closePath();X.fill();X.stroke();break;
    case'boss':// Boss - 大型棱形
      X.beginPath();X.moveTo(0,-s/2-6);X.lineTo(s/2+4,0);X.lineTo(0,s/2+4);X.lineTo(-s/2-4,0);X.closePath();X.fill();
      X.strokeStyle='rgba(255,200,100,0.8)';X.lineWidth=2.5;X.stroke();
      X.fillStyle='#ffd700';X.font='18px "Microsoft YaHei"';X.textAlign='center';X.fillText('👑',0,-s/2-16);X.textAlign='start';break;
    default:
      X.beginPath();X.arc(0,0,s/2,0,T);X.fill();X.strokeStyle='rgba(0,0,0,0.3)';X.lineWidth=1.5;X.stroke();
  }

  // 表情 - Canvas绘制
  const fry=mon.sh==='knight'?-4:mon.sh==='bat'?5:0;
  drawPortrait(0,fry,s/2.8,mon.sh+'|'+mon.n,true);
  }catch(e){}finally{X.restore();}

  // 血条(受伤时)
  if(mon.hp<mon.mhp){
    const bw=s+12,bh=5,bx=mx+s/2-bw/2,by=my-12;
    X.fillStyle='rgba(0,0,0,0.7)';rr(bx-1,by-1,bw+2,bh+2,3);X.fill();
    dbar(bx,by,bw,bh,mon.hp,mon.mhp,mon.boss?'#ff3333':'#ee5555','#300');
  }
  if(mon.isDef){X.fillStyle='#88ccff';X.font='bold 11px "Microsoft YaHei"';X.textAlign='center';X.fillText('🛡️',mx+s/2,my-18);X.textAlign='start';}
}

/** 绘制宝箱 */
function drawChest(cx,cy,chst){
  const s=28,bounce=chst.opened?0:Math.sin(frm*.06+chst.glow)*2;
  X.save();X.translate(cx+s/2,cy+s/2+bounce);
  if(!chst.opened){
    // 光晕
    const glowA=.15+Math.sin(frm*.05+chst.glow)*.1;
    X.fillStyle=`rgba(255,215,0,${glowA})`;X.beginPath();X.arc(0,0,s/2+8,0,T);X.fill();
  }
  // 箱体
  const qc=chst.quality==='legend'?'#ff8833':(chst.quality==='epic'?'#cc55ff':'#55aaff');
  const bG=X.createLinearGradient(0,-s/2,0,s/2);
  bG.addColorStop(0,'#c89660');bG.addColorStop(.5,'#aa7744');bG.addColorStop(1,'#885533');
  X.fillStyle=bG;rr(-s/2,-s/4,s,s/2,4);X.fill();
  X.strokeStyle=qc;X.lineWidth=chst.opened?1.5:2.5;rr(-s/2,-s/4,s,s/2,4);X.stroke();
  // 箱盖
  if(!chst.opened){
    X.fillStyle='#d4aa70';rr(-s/2-2,-s/4-2,s+4,s/3,5);X.fill();
    X.strokeStyle=qc;X.lineWidth=2;rr(-s/2-2,-s/4-2,s+4,s/3,5);X.stroke();
    // 锁扣
    X.fillStyle='#ffd700';X.beginPath();X.arc(0,0,5,0,T);X.fill();X.strokeStyle='#aa8800';X.lineWidth=1;X.stroke();
    X.fillStyle='#333';X.fillRect(-1.5,-2.5,3,5);
  }else{
    // 打开状态
    X.fillStyle='rgba(0,0,0,0.4)';rr(-s/2,s/4,s,s/3,3);X.fill();
  }
  // 品质光点
  if(!chst.opened){
    for(let i=0;i<3;i++){
      const a=frm*.08+i*2.1,dx=Math.cos(a)*s/2,dy=Math.sin(a)*s/3;
      X.fillStyle=qc;X.beginPath();X.arc(dx,dy,2,0,T);X.fill();
    }
  }
  X.restore();
}

function updCam(){if(!cmap)return;cam.tx=player.x-W/2;cam.ty=player.y-H/2;cam.tx=CL(cam.tx,0,cmap.w-W);cam.ty=CL(cam.ty,0,cmap.h-H);cam.x=LR(cam.x,cam.tx,.1);cam.y=LR(cam.y,cam.ty,.1);}

function updPlayer(){
  if(!player||!cmap||gs!==ST.P)return;if(fto||dia)return;
  let dx=0,dy=0;
  // 键盘
  if(keys['w']||keys['arrowup'])dy=-1;if(keys['s']||keys['arrowdown'])dy=1;if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;
  // 虚拟摇杆
  if(jActive&&(Math.abs(js.a.dx)>.15||Math.abs(js.a.dy)>.15)){dx=js.a.dx;dy=js.a.dy;}
  if(dx!==0&&dy!==0&&Math.abs(dx)<=1&&Math.abs(dy)<=1){dx*=.707;dy*=.707;}
  if(dx!==0||dy!==0){const sp=eSpd();player.x+=dx*sp;player.y+=dy*sp;player.mv=true;player.face=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}else{player.mv=false;}
  player.x=CL(player.x,18,cmap.w-54);player.y=CL(player.y,38,cmap.h-54);
}
function updMons(){if(!cmap||cmap.safe||gs!==ST.P)return;for(const mon of cmap.mons){if(!mon.alive)continue;mon.pt--;if(mon.pt<=0){mon.pd={x:(R(-.5,1))*1.5,y:(R(-.5,1))*1.5};mon.pt=80+R(0,160);}mon.x+=mon.pd.x;mon.y+=mon.pd.y;mon.x=CL(mon.x,35,cmap.w-65);mon.y=CL(mon.y,35,cmap.h-65);}}

function chkBat(){if(!cmap||cmap.safe||gs!==ST.P||fto||dia)return;for(const mon of cmap.mons){if(!mon.alive)continue;if(Math.hypot(player.x-mon.x,player.y-mon.y)<38){startBat(mon);return;}}}
function chkTrans(){if(!cmap||gs!==ST.P||fto||trCd>0)return;for(const tr of cmap.tr){if(Math.hypot(player.x-tr.x,player.y-tr.y)<tr.r+10){startFade(tr);return;}}}
function chkNPC(){if(!cmap||gs!==ST.P||dia||diaCd>0)return;for(const npc of cmap.npc){if(Math.hypot(player.x-npc.x,player.y-npc.y)<60&&keys[' ']){keys[' ']=false;doNPC(npc);return;}}}
function chkChest(){if(!cmap||gs!==ST.P||fto||dia)return;
  for(const ch of cmap.chst){if(ch.opened)continue;if(Math.hypot(player.x-ch.x,player.y-ch.y)<40){openChest(ch);return;}}
}
function startFade(tr){fto=tr;fa=0;fd=0;}
function doNPC(npc){SFX.play('click');const key=npc.n,mem=npcMem[key]=npcMem[key]||{talk:0,quest:null};
  mem.talk++;diaCd=25;
  // 生成对话
  let lines=[...npc.dlg];
  // 任务相关对话
  if(mem.quest&&mem.quest.done){lines.push('感谢你完成了任务！这是你的奖励~');lines.push('下次再来找我吧！');mem.quest=null;}
  else if(mem.quest&&!mem.quest.done){
    const q=mem.quest;
    if(q.type==='kill')lines.push(`任务进度: 击败怪物 ${q.progress}/${q.target}`);
    else if(q.type==='gold')lines.push(`任务进度: 收集金币 ${Math.min(player.gold,q.target)}/${q.target}`);
    lines.push('完成后记得来找我领奖励哦！');
  }else if(mem.talk>=3&&!mem.quest){
    // 3次对话以上触发任务
    const qt=PK(['kill','gold','collect','boss','explore','equip']);
    if(qt==='kill'){mem.quest={type:'kill',target:5+RI(0,8),progress:0,reward:{xp:80+RI(0,120),gold:60+RI(0,100),eq:true},done:false};lines.push('🔹新任务: 击败'+mem.quest.target+'只怪物！奖励史诗装备');}
    else if(qt==='gold'){mem.quest={type:'gold',target:150+RI(0,300),progress:0,reward:{xp:60+RI(0,100),gold:80+RI(0,120),eq:true},done:false};lines.push(`🔹新任务: 收集${mem.quest.target}金币！奖励史诗装备`);}
    else if(qt==='collect'){mem.quest={type:'collect',target:3+RI(0,4),item:'材料',progress:0,reward:{xp:100+RI(0,150),eq:true},done:false};lines.push(`🔹新任务: 收集${mem.quest.target}个材料！奖励史诗装备`);}
    else if(qt==='boss'){mem.quest={type:'boss',target:1,progress:0,reward:{xp:200+RI(0,200),gold:150+RI(0,200),eq:true},done:false};lines.push('🔹新任务: 击败任意BOSS！奖励传说装备');}
    else if(qt==='explore'){const tmid=PK(['frost','desert','swamp','cave','castle','abyss']);mem.quest={type:'explore',target:tmid,progress:0,reward:{xp:120+RI(0,150),gold:100+RI(0,150),eq:true},done:false};lines.push(`🔹新任务: 探索${maps[tmid]?maps[tmid].n:tmid}！`);}
    else{const tq=PK([Q.E,Q.E,Q.L]);mem.quest={type:'equip',target:tq,progress:0,reward:{xp:90+RI(0,140),gold:70+RI(0,120),eq:true},done:false};lines.push(`🔹新任务: 装备一件${tq==='epic'?'史诗':tq==='legend'?'传说':'神话'}或以上品质装备！`);}
  }
  // 随机趣味对话
  if(mem.talk>3&&Math.random()<.3){
    const rl=[`今天天气真不错~`,`你已经是第${mem.talk}次来找我了！`,`听说城堡深处有传说装备...`,`冒险的路上要小心哦！`,`(●´∀｀●) 看到你就开心！`];
    lines.splice(lines.length-1,0,PK(rl));
  }
  dia={npc,lines,idx:0};
}
function doNpcAct(npc){
  if(npc.tp==='inn'){player.hp=eMhp();player.mp=player.mmp;ntf('旅店休息，HP/MP全满！','heal');svGame();}
  else if(npc.tp==='shop'){gs=ST.S;ps=ST.P;}
  else if(npc.tp==='exch'){if(player.coins>=10&&!player.wings){player.coins-=10;player.wings=true;player.title='翼之守护者';ntf('获得天使之翼！','lvl');SFX.play('lvl');svGame();}else if(player.wings)ntf('你已经拥有翅膀了~','info');else ntf(`还需${10-player.coins}枚猪猪币`,'info');}
  else if(npc.tp==='craft'){gs=ST.CR;ps=ST.P;}
  else if(npc.tp==='skill'){gs=ST.SK;ps=ST.P;}
  else if(npc.tp==='sage'){ntf('感谢你的冒险...','lvl');SFX.play('lvl');player.hp=eMhp();player.mp=player.mmp;svGame();}
}
function advDia(){
  if(!dia)return;
  dia.idx++;
  if(dia.idx>=dia.lines.length){
    const npc=dia.npc;dia=null;diaCd=30;
    if(npc.tp){doNpcAct(npc);chkQuest(npc);}
    // 检查任务完成
    else chkQuest(npc);
  }else{SFX.play('click');}
}
function chkQuest(npc){
  const key=npc.n,mem=npcMem[key];if(!mem||!mem.quest||mem.quest.done)return;
  const q=mem.quest;let done=false;
  if(q.type==='kill'&&q.progress>=q.target)done=true;
  else if(q.type==='boss'&&q.progress>=q.target)done=true;
  else if(q.type==='gold'&&player.gold>=q.target)done=true;
  else if(q.type==='explore'&&mid===q.target)done=true;
  else if(q.type==='collect'){const mc=player.inv.filter(it=>it.type===ITY.MAT).reduce((s,it)=>s+(it.stack||1),0);q.progress=mc;if(mc>=q.target)done=true;}
  else if(q.type==='equip'){for(const k of EQP){const eq=player.eq[k];if(eq&&(eq.quality===q.target||(q.target===Q.E&&(eq.quality===Q.L||eq.quality===Q.M))||(q.target===Q.L&&eq.quality===Q.M))){done=true;break;}}}
  if(done){q.done=true;const r=q.reward;if(r.xp)player.xp+=r.xp;if(r.gold)player.gold+=r.gold;if(r.eq){const eqQ=Math.random()<.55?Q.E:(Math.random()<.35?Q.L:Q.R);const it=mkItem(ITY.EQ,q.type==='boss'?Q.L:eqQ);if(autoEquip(it))ntf('任务奖励: 自动装备'+it.name,'lvl');else if(player.inv.length<player.bagSize)player.inv.push(it);else player.gold+=Math.floor(it.val*.5);}ntf('🎉任务完成！奖励已发放','lvl');SFX.play('lvl');chkLvlUp();svGame();}
}
function onKillMon(mon){if(!mon)return;for(const k of Object.keys(npcMem)){const q=npcMem[k].quest;if(!q||q.done)continue;if(q.type==='kill'){q.progress++;if(q.progress>=q.target)ntf('任务目标达成！回去交任务吧','info');}if(q.type==='boss'&&mon.boss){q.progress=1;ntf('BOSS讨伐完成！回去领奖励吧','info');}}}

function openChest(ch){
  ch.opened=true;SFX.play('chst');
  const r=Math.random(),q=r<.0001?Q.M:(r<.0011?Q.L:(r<.0111?Q.E:(r<.0411?Q.R:Q.C)));
  const it=mkItem(ITY.EQ,q);
  if(autoEquip(it)){ntf(`宝箱: ${it.name} (已自动装备)`,'lvl');}

  else{player.gold+=Math.floor(it.val*.5);ntf(`宝箱: ${it.name} (背包满已折现)`,'info');}
  for(let i=0;i<18;i++)spP(ch.x,ch.y,'star',35);
  spImpactRing(ch.x,ch.y,'#ffd700');svGame();
}

let bmi=0,bso=false,bsi=0;
function startBat(mon){bat={ref:mon,turn:'player',anim:null,atim:0,amax:24,crit:false,flash:0,pdef:false,_impactDone:false,_eImpactDone:false,_mImpactDone:false};bmi=0;bso=false;bsi=0;gs=ST.B;ps=ST.P;SFX.play(mon.boss?'boss':'atk');if(mon.boss)ntf('⚠ BOSS战: '+mon.n+'!','err');}

function exAtk(){const m=bat.ref,crit=Math.random()<eCrt();const bd=Math.max(1,eAtk()-m.def*(m.isDef ? 1.5 : 1));const dmg=crit?Math.floor(bd*2.0):Math.floor(bd*(.85+R(0,.3)));m.hp-=dmg;if(m.hp<0)m.hp=0;const ls=eLfS();if(ls>0){const heal=Math.floor(dmg*ls);player.hp=Math.min(eMhp(),player.hp+heal);if(heal>0)spF(W/2,H-210,'+'+heal,'#ff88ff');}bat.anim='patk';bat.atim=bat.amax;bat.crit=crit;bat._impactDone=false;spF(W/2,140,dmg+'',crit?'#ffcc00':'#ff4444');shk(crit?11:5,crit?18:10);SFX.play(crit?'crt':'hit1');bat.flash=8;m.isDef=false;bat.turn='enemy';}

function exSk(skillId){const sk=SKDB[skillId];if(!sk){ntf('未知技能！','err');return;}if(!player.skillSlots.includes(skillId)){ntf('未装备此技能！','err');return;}const up=sk.upLvl||1;const cost=Math.floor(sk.cost*(1+(up-1)*.15));if(player.mp<cost){ntf('MP不足！','err');return;}player.mp-=cost;const m=bat.ref;if(sk.cat==='heal'){const h=Math.floor(eMhp()*(sk.pow+(up-1)*.04));player.hp=Math.min(eMhp(),player.hp+h);spF(W/2,H-210,'+'+h,'#66ff66');for(let i=0;i<24;i++)spP(W/2-20+R(0,40),H-210+R(0,40),'heal',32);SFX.play('heal');ntf(`回复了${h}点HP`,'heal');bso=false;setTimeout(()=>{if(gs===ST.B&&bat)bat.turn='enemy';},500);return;}else if(sk.cat==='buff'){bat.pdef=true;SFX.play('click');ntf('进入守护姿态！','info');}else{const isMag=sk.cat==='mag'||sk.cat==='drain';const atkStat=isMag?eMatk():eAtk();const defStat=isMag?m.def*.5:m.def*(m.isDef?1.5:1);const p=(sk.pow+(up-1)*.1);const dmg=Math.floor(Math.max(1,atkStat*p-defStat)*(.82+R(0,.36)));m.hp-=dmg;if(m.hp<0)m.hp=0;if(sk.cat==='drain'){const hl=Math.floor(dmg*.5);player.hp=Math.min(eMhp(),player.hp+hl);spF(W/2,H-210,'+'+hl,'#ff88ff');}bat.anim=isMag?'meteor':'patk';bat.atim=bat.amax;bat._impactDone=false;bat._mImpactDone=false;spF(W/2,140,dmg+'',isMag?'#4488ff':'#ff6644');shk(isMag?18:15,isMag?24:20);SFX.play(isMag?'fire':'hit2');bat.flash=isMag?12:10;if(isMag)for(let i=0;i<35;i++)spP(W/2-50+R(0,100),80+R(0,70),'fire',32);}m.isDef=false;bso=false;bat.turn='enemy';}

function exItem(){let idx=player.inv.findIndex(it=>it.type===ITY.CON&&it.heal);if(idx>=0){const pot=player.inv[idx];player.hp=Math.min(eMhp(),player.hp+pot.heal);if(pot.stack>1)pot.stack--;else player.inv.splice(idx,1);spF(W/2,H-210,'+'+pot.heal,'#ff8888');SFX.play('heal');ntf('使用了'+pot.name,'info');bat.turn='enemy';return;}idx=player.inv.findIndex(it=>it.type===ITY.CON&&it.restore);if(idx>=0){const pot=player.inv[idx];player.mp=Math.min(player.mmp,player.mp+pot.restore);if(pot.stack>1)pot.stack--;else player.inv.splice(idx,1);spF(W/2,H-210,'+'+pot.restore,'#8888ff');SFX.play('heal');ntf('使用了'+pot.name,'info');}else{ntf('没有可用药水！','err');}bat.turn='enemy';}
function exFlee(){if(bat.ref.boss){ntf('BOSS战不可逃跑！','err');return;}if(Math.random()<.55){bat=null;gs=ST.P;ntf('溜了溜了~','info');SFX.play('dash');}else{ntf('逃跑失败！','err');SFX.play('err');bat.turn='enemy';}}

function exEnemy(){const m=bat.ref;if(!m)return;m.isDef=false;const r=Math.random();
  if(m.boss&&m.hp<m.mhp*m.pth&&m.ph===1){m.ph=2;m.atk=Math.floor(m.atk*1.45);m.def=Math.floor(m.def*1.25);ntf('⚠ '+m.n+' 进入狂暴阶段！','err');SFX.play('boss');for(let i=0;i<30;i++)spP(m.x,m.y,'fire',42);shk(22,28);}
  if(m.sk&&r<.38){const sd=Math.floor(Math.max(1,m.atk*1.6-eDef())*(.9+R(0,.2)));player.hp-=sd;if(player.hp<0)player.hp=0;spF(W/2,H-210,sd+'','#ff8844');shk(9,15);SFX.play('fire');bat.anim='enemy';bat.atim=bat.amax;bat._eImpactDone=false;ntf(m.n+'释放了技能！','err');}
  else if(r<.86){const dmg=Math.floor(Math.max(1,m.atk-eDef())*(.85+R(0,.3)));player.hp-=dmg;if(player.hp<0)player.hp=0;spF(W/2,H-210,dmg+'','#ff4444');shk(5,10);SFX.play('hurt');bat.anim='enemy';bat.atim=bat.amax;bat._eImpactDone=false;}
  else{m.isDef=true;SFX.play('click');ntf(m.n+'进入防御姿态','info');}
  bat.turn='player';}

function chkBatEnd(){if(!bat)return;if(bat.ref.hp<=0){batWin();return;}if(player.hp<=0){batLose();return;}}
function batWin(){const m=bat.ref;const eg=m.xp,gg=Math.floor(m.gold*.7);player.xp+=eg;player.gold+=gg;let drop=null,coin=false;
  // 消耗品掉落
  const addIt=(it)=>{
    if(it.type===ITY.EQ){if(autoEquip(it)){SFX.play('buy');ntf(`自动装备: ${it.name}！`,'lvl');return;}}
    if(tryStack(it))return;
    if(player.inv.length<player.bagSize)player.inv.push(it);else ntf('背包已满！','err');
  };
  if(Math.random()<.38){const it=mkItem(ITY.CON,PK([Q.HP,Q.MP,Q.HP,Q.MP,'big_hp','big_mp']));addIt(it);if(!drop)drop=it;}
  if(m.boss){const it=mkItem(ITY.EQ,m.ph>=2?(Math.random()<.4?Q.M:Q.L):(Math.random()<.1?Q.M:Q.L));addIt(it);drop=it;SFX.play('lvl');ntf('获得'+it.name+'!','lvl');}
  else if(Math.random()<.20){const r=Math.random(),q=r<.00008?Q.M:(r<.00088?Q.L:(r<.00888?Q.E:(r<.03888?Q.R:Q.C)));const it=mkItem(ITY.EQ,q);addIt(it);if(!drop)drop=it;}
  else if(Math.random()<.22){const it=mkItem(ITY.MAT);addIt(it);if(!drop)drop=it;}
  // 2%技能书掉落
  if(Math.random()<.02){const it=mkItem(ITY.SKB);addIt(it);if(!drop)drop=it;if(it.skillId)ntf('📖 技能书掉落: '+it.name+'!','lvl');}
  // 稀有背包扩容掉落
  if(Math.random()<.015){const it=mkItem(ITY.BAG);addIt(it);if(!drop)drop=it;ntf('🎒 稀有掉落: 扩容背包！','lvl');}
  if(Math.random()<.07){player.coins++;coin=true;if(player.coins>=10&&!player.wings){player.wings=true;player.title='翼之守护者';ntf('✨获得翅膀！✨','lvl');}}
  const lvlUp=chkLvlUp();const idx=cmap.mons.findIndex(mo=>mo.uid===m.uid);if(idx>=0)cmap.mons.splice(idx,1);
  setTimeout(()=>respMon(mid),4500);bwr={xp:eg,gold:gg,drop,coin,lvlUp};bat=null;gs=ST.BW;SFX.play(lvlUp?'lvl':'drop');onKillMon(m);svGame();}
function batLose(){player.gold=Math.floor(player.gold*.88);player.hp=eMhp();player.mp=player.mmp;bat=null;if(mid!=='town'&&mid)prevMid=mid;mid='town';cmap=maps['town'];player.x=cmap.sp.x;player.y=cmap.sp.y;updCam();cam.x=cam.tx;cam.y=cam.ty;svGame();gs=ST.GO;SFX.play('err');ntf('战斗不能...回到了星落镇','err');}
function chkLvlUp(){if(!player)return false;let up=false;while(player.xp>=xpN(player.lv)){player.xp-=xpN(player.lv);player.lv++;player.mhp+=28;player.hp=eMhp();player.mmp+=16;player.mp=player.mmp;player.atk+=5;player.def+=4;player.matk+=3;player.mdef+=2;player.spd+=.2;for(let i=0;i<45;i++)spP(player.x,player.y,'star',45);shk(7,24);SFX.play('lvl');up=true;}return up;}

function doCraft(){const mats=player.inv.filter(it=>it.type===ITY.MAT);if(mats.length<3){ntf('需要3个材料！','err');return;}
  let removed=0;
  for(let i=player.inv.length-1;i>=0&&removed<3;i--){const it=player.inv[i];if(it.type===ITY.MAT){if(it.stack>1){it.stack--;removed++;}else{player.inv.splice(i,1);removed++;}}}
  const r=Math.random(),q=r<.00015?Q.M:(r<.00165?Q.L:(r<.01665?Q.E:(r<.04665?Q.R:Q.C)));
  const it=mkItem(ITY.EQ,q);
  if(it.type===ITY.EQ&&autoEquip(it)){ntf(`合成+自动装备: ${it.name}！`,'lvl');}
  else{if(player.inv.length<player.bagSize)player.inv.push(it);else{ntf('背包已满！','err');return;}}
  SFX.play('buy');svGame();}

function render(){
  X.clearRect(0,0,W,H);X.save();
  try{

    switch(gs){case ST.M:renderMenu();break;case ST.P:renderWorld();renderHUD();break;case ST.B:renderBattle();break;case ST.S:renderWorld();renderHUD();renderShop();break;case ST.I:renderWorld();renderHUD();renderInv();break;case ST.CR:renderWorld();renderHUD();renderCraft();break;case ST.SK:renderWorld();renderHUD();renderSkillShop();break;case ST.BW:renderWorld();renderHUD();renderBW();break;case ST.OF:renderWorld();renderHUD();renderOF();break;case ST.GO:renderWorld();renderHUD();break;}

function renderAllP(){

// ═══════ 触屏支持 ═══════
// 虚拟摇杆
const JR=55,JIR=22;
let jActive=false,jId=-1,jCX=0,jCY=0;

function getCP(e){
  const t=e.touches?e.touches[0]:e,r=C.getBoundingClientRect();
  return {x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height),id:t.identifier};
}

C.addEventListener('touchstart',e=>{e.preventDefault();SFX.init();
  for(const t of e.changedTouches){
    const r=C.getBoundingClientRect(),cx=(t.clientX-r.left)*(W/r.width),cy=(t.clientY-r.top)*(H/r.height),id=t.identifier;
    // 如果有对话框，全屏点击都推进对话
    if(dia){
      // 对话框区域点击推进
      const dbx=30,dby=H-120,dbw=W-60,dbh=100;
      if(cx>=dbx&&cx<=dbx+dbw&&cy>=dby&&cy<=dby+dbh){doAct('advDia');}
      continue;
    }
    // 右半屏 → 只处理UI点击，不检测NPC
    if(cx>=W/2){
      handleClick(cx,cy);
      continue;
    }
    // 左半屏 → 纯摇杆控制移动
    jActive=true;jId=id;jCX=cx;jCY=cy;js.a.x=cx;js.a.y=cy;js.a.id=id;js.a.dx=0;js.a.dy=0;
  }
},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches){
    const r=C.getBoundingClientRect(),cx=(t.clientX-r.left)*(W/r.width),cy=(t.clientY-r.top)*(H/r.height),id=t.identifier;
    if(jActive&&id===jId){const dx=cx-jCX,dy=cy-jCY,d=Math.hypot(dx,dy);const a=Math.atan2(dy,dx);const m=Math.min(d,JR);js.a.dx=Math.cos(a)*m/JR;js.a.dy=Math.sin(a)*m/JR;}
  }
},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();
  for(const t of e.changedTouches){
    const id=t.identifier;
    if(jActive&&id===jId){jActive=false;jId=-1;js.a.dx=0;js.a.dy=0;}
  }
  // touchend：NPC对话检测（全屏有效，左右都能点到NPC）
  for(const t of e.changedTouches){
    const r=C.getBoundingClientRect(),cx=(t.clientX-r.left)*(W/r.width),cy=(t.clientY-r.top)*(H/r.height);
    // NPC对话检测：全屏touchend触发
    if(gs===ST.P&&cmap&&!dia&&!diaCd){checkTapNPC(cx,cy);}
    // UI按钮点击
    handleClick(cx,cy);
  }
},{passive:false});

// 点击NPC：全屏touchend触发
function checkTapNPC(cx,cy){
  if(dia||diaCd>0)return;
  const wx=cx+cam.x,wy=cy+cam.y;
  for(const npc of cmap.npc){
    const nx=npc.x-cam.x,ny=npc.y-cam.y;
    if(Math.abs(cx-nx)<35&&Math.abs(cy-ny)<50){doNPC(npc);return;}
  }
  for(const ch of cmap.chst){
    if(ch.opened)continue;
    const cx2=ch.x-cam.x,cy2=ch.y-cam.y;
    if(Math.abs(cx-cx2)<30&&Math.abs(cy-cy2)<30){openChest(ch);return;}
  }
}

function handleClick(cx,cy){
  const ovs=clk.filter(c=>c.ov),norms=clk.filter(c=>!c.ov);
  for(let i=norms.length-1;i>=0;i--){const t=norms[i];if(cx>=t.x&&cx<=t.x+t.w&&cy>=t.y&&cy<=t.y+t.h){doAct(t.act);return;}}
  for(let i=ovs.length-1;i>=0;i--){const t=ovs[i];if(cx>=t.x&&cx<=t.x+t.w&&cy>=t.y&&cy<=t.y+t.h){if([ST.S,ST.I,ST.CR,ST.SK].includes(gs)){gs=ps||ST.P;return;}}}
}

function doAct(act){
  if(btnCd>0)return;btnCd=15;
  SFX.play('click');
  switch(act){
    case'new':startNew();break;case'cont':doCont();break;case'save':svGame();ntf('游戏已保存！','info');break;
    case'inv':gs=ST.I;ps=ST.P;break;case'shop':gs=ST.S;ps=ST.P;break;case'craft':gs=ST.CR;ps=ST.P;break;case'skillShop':gs=ST.SK;ps=ST.P;break;
    case'closeP':gs=ps||ST.P;_shTab=0;break;
    case'bs_cancel':if(gs===ST.B){bso=false;}break;case'closeOF':if(ofr){player.xp+=ofr.xp;player.gold+=ofr.gold;chkLvlUp();ofr=null;}gs=ST.P;svGame();break;case'closeBW':bwr=null;gs=ST.P;break;case'closeGO':gs=ST.P;break;
    case'petal':startPetal();break;case'doCraft':doCraft();break;case'shtab_0':_shTab=0;break;case'shtab_1':_shTab=1;break;case'pg_prev':if(_ipg>0)_ipg--;break;case'pg_next':_ipg++;break;case'advDia':advDia();break;
    case'home':if(cmap&&cmap.id!=='town'){prevMid=mid;fto=null;fa=0;fd=0;mid='town';cmap=maps['town'];player.x=cmap.sp.x;player.y=cmap.sp.y;updCam();cam.x=cam.tx;cam.y=cam.ty;svGame();gs=ST.P;ntf('回到了星落镇','info');}break;
    case'goback':{const pm=(prevMid&&maps[prevMid])?prevMid:'meadow';prevMid='town';mid=pm;cmap=maps[pm];player.x=cmap.sp.x;player.y=cmap.sp.y;if(!cmap.mons||cmap.mons.length<5)popMon(pm);updCam();cam.x=cam.tx;cam.y=cam.ty;svGame();gs=ST.P;ntf('返回'+cmap.n,'info');}break;
    case'ba':if(gs===ST.B&&bat&&bat.turn==='player'&&!bat.anim)exAtk();break;
    case'bs':if(gs===ST.B&&bat&&bat.turn==='player'&&!bat.anim){bso=true;bsi=0;}break;
    case'bi':if(gs===ST.B&&bat&&bat.turn==='player'&&!bat.anim)exItem();break;
    case'bf':if(gs===ST.B&&bat&&bat.turn==='player'&&!bat.anim)exFlee();break;
    case'bphp':{if(player.gold<65){ntf('金币不足！','err');break;}player.gold-=65;const it=mkItem(ITY.CON,Q.HP);if(tryStack(it)){}else if(player.inv.length<player.bagSize)player.inv.push(it);else{ntf('背包已满！','err');break;}SFX.play('buy');ntf('购买了生命药水','info');svGame();}break;
    case'bpmp':{if(player.gold<75){ntf('金币不足！','err');break;}player.gold-=75;const it=mkItem(ITY.CON,Q.MP);if(tryStack(it)){}else if(player.inv.length<player.bagSize)player.inv.push(it);else{ntf('背包已满！','err');break;}SFX.play('buy');ntf('购买了魔法药水','info');svGame();}break;
    case'bbhp':{if(player.gold<150){ntf('金币不足！','err');break;}player.gold-=150;const it=mkItem(ITY.CON,'big_hp');if(tryStack(it)){}else if(player.inv.length<player.bagSize)player.inv.push(it);else{ntf('背包已满！','err');break;}SFX.play('buy');ntf('购买了大生命药水','info');svGame();}break;
    case'bbmp':{if(player.gold<160){ntf('金币不足！','err');break;}player.gold-=160;const it=mkItem(ITY.CON,'big_mp');if(tryStack(it)){}else if(player.inv.length<player.bagSize)player.inv.push(it);else{ntf('背包已满！','err');break;}SFX.play('buy');ntf('购买了大魔法药水','info');svGame();}break;
    case'bbb':{if(player.gold<280){ntf('金币不足！','err');break;}player.gold-=280;const it=mkBB();if(it.type===ITY.EQ&&autoEquip(it)){ntf('获得+自动装备: '+it.name+'！','lvl');}else if(player.inv.length<player.bagSize)player.inv.push(it);else{ntf('背包已满！','err');break;}SFX.play('buy');svGame();}break;
    case'bmat':{if(player.gold<240){ntf('金币不足！','err');break;}player.gold-=240;let added=0;for(let k=0;k<3;k++){const it=mkItem(ITY.MAT);if(tryStack(it)){added++;}else if(player.inv.length<player.bagSize){player.inv.push(it);added++;}}SFX.play('buy');ntf(`获得${added}个材料`,'info');svGame();}break;
    case'bbag':{if(player.gold<800){ntf('金币不足！','err');break;}if(player.bagSize>=300){ntf('背包已达上限！','err');break;}player.gold-=800;player.bagSize=Math.min(300,player.bagSize+10);SFX.play('lvl');ntf(`背包扩容至${player.bagSize}格！`,'lvl');svGame();}break;
    default:

        }else if(it.type===ITY.SKB){
          if(it.skillId&&!player.skillsKnown.includes(it.skillId)){
            player.skillsKnown.push(it.skillId);
            if(it.stack>1)it.stack--;else player.inv.splice(i,1);
            SFX.play('lvl');ntf('学会了'+SKDB[it.skillId].n+'！','lvl');svGame();
          }else{ntf('已学会该技能或技能书无效，可出售换金币','info');}
        }
      }else if(act.startsWith('eql_')){
        const i=parseInt(act.split('_')[1]),it=player.inv[i];if(!it||it.type!==ITY.EQ)return;
        const sl=it.slot,old=player.eq[sl];
        if(old){if(player.inv.length<player.bagSize)player.inv.push(old);else{ntf('背包已满！','err');return;}}
        player.eq[sl]=it;player.inv.splice(i,1);SFX.play('buy');ntf('装备了'+it.name,'lvl');svGame();
      }else if(act.startsWith('sell_')){
        const i=parseInt(act.split('_')[1]),it=player.inv[i];if(!it)return;
        const v=Math.floor(it.val*.5);player.gold+=v;
        if(it.stack>1)it.stack--;else player.inv.splice(i,1);
        SFX.play('coin');ntf('出售'+it.name+'获得'+v+'💰','info');svGame();
      }else if(act.startsWith('shsell_')){
        const i=parseInt(act.split('_')[1]),it=player.inv[i];if(!it)return;
        const v=Math.floor(it.val*.5);player.gold+=v;
        if(it.stack>1)it.stack--;else player.inv.splice(i,1);
        SFX.play('coin');ntf('出售'+it.name+'获得'+v+'💰','info');svGame();
      }else if(act.startsWith('uneq_')){const sl=act.split('_')[1],eq=player.eq[sl];if(eq){if(player.inv.length>=player.bagSize){ntf('背包已满！','err');return;}player.inv.push(eq);player.eq[sl]=null;SFX.play('click');ntf('卸下了'+eq.name,'info');svGame();}}
      else if(act.startsWith('learn_')){const sid=act.split('_')[1],sk=SKDB[sid];if(!sk)return;if(player.gold<sk.upCost){ntf('金币不足！','err');return;}if(player.skillsKnown.includes(sid))return;if(player.lv<sk.lvl){ntf('等级不足！需要Lv.'+sk.lvl,'err');return;}player.gold-=sk.upCost;player.skillsKnown.push(sid);SFX.play('lvl');ntf('学会了'+sk.n+'！','lvl');svGame();}
      else if(act.startsWith('upSkill_')){const sid=act.split('_')[1],sk=SKDB[sid];if(!sk)return;const uc=Math.floor(sk.upCost*(sk.upLvl||1));if(player.gold<uc){ntf('金币不足！','err');return;}sk.upLvl=(sk.upLvl||1)+1;player.gold-=uc;SFX.play('lvl');ntf(sk.n+'升级至Lv.'+sk.upLvl+'！','lvl');svGame();}
      else if(act.startsWith('eqSkill_')){const sid=act.split('_')[1];if(!player.skillsKnown.includes(sid))return;const empty=player.skillSlots.findIndex(s=>s===null);if(empty>=0){if(player.skillSlots.includes(sid)){player.skillSlots[player.skillSlots.indexOf(sid)]=null;}player.skillSlots[empty]=sid;SFX.play('click');ntf('技能已装备到槽'+(empty+1),'info');svGame();}else{ntf('所有技能槽已满！先卸下一个','err');}}
      else if(act.startsWith('unslot_')){const i=parseInt(act.split('_')[1]);if(player.skillSlots[i]){player.skillSlots[i]=null;SFX.play('click');ntf('技能已卸下','info');svGame();}}
  }
}

// ═══════ 自适应缩放 ═══════
function resizeCanvas(){
  const c=document.getElementById('g'),s=document.getElementById('szStyle');
  const r=1060/660;
  const isMobile=window.innerWidth<=768;
  const isPortrait=window.innerHeight>window.innerWidth;
  let w,h;
  if(isMobile && isPortrait){
    // 竖屏手机：宽高互换，模拟横屏布局
    w=window.innerHeight;
    h=window.innerWidth;
  }else{
    // 已横屏(小程序强制横屏)或桌面：正常计算
    w=window.innerWidth;
    h=window.innerHeight;
  }
  if(w/h>r){w=h*r;}else{h=w/r;}
  s.textContent=`canvas{width:${w}px!important;height:${h}px!important;}`;
}
// 屏幕方向变化监听

window.addEventListener('orientationchange',function(){setTimeout(resizeCanvas,300);});
